[package]
name = "ats-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
pdf-extract = "0.12"
regex = "1.13.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
